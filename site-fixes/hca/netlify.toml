# Netlify configuration for the HCA site
# The site is plain static HTML/CSS/JS – no build step needed.

[build]
  publish = "."
  command = ""

# Pretty URLs: /us instead of /us.html (optional, Netlify also does this automatically)
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Custom 404: Netlify serves /404.html automatically for unknown paths.

# Long cache for self-hosted fonts
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
